name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate Glaze UI and Motion evaluation boundary
        run: python3 scripts/check_glaze_motion_evaluation.py

      - name: Validate editor privacy lifecycle boundary
        run: python3 scripts/check_editor_privacy_lifecycle.py

      - name: Validate keyboard accessibility boundary
        run: python3 scripts/check_keyboard_accessibility.py

      - name: Validate repository feature and changelog records
        run: python3 scripts/check_repository_feature_records.py

      - name: Run unit tests
        run: gradle :android:app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :android:app:assembleDebug --stacktrace

      - name: Stage self-verifying Keyboard Development APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ARTIFACT_ROOT="artifact-keyboard-android"
          rm -rf "$ARTIFACT_ROOT"
          mkdir -p "$ARTIFACT_ROOT"
          cp "$APK" "$ARTIFACT_ROOT/GoreeCloudKeyboardDev-0.1.9.apk"
          cat > "$ARTIFACT_ROOT/BUILD-PROVENANCE.txt" <<EOF
          repository=GoreeCloud/keyboard
          source_sha=$SOURCE_SHA
          version_name=0.1.9-dev
          application_id=com.goreecloud.keyboard.dev.v10
          artifact_role=android-keyboard-development-acceptance
          signing_role=ci-debug-installability-only
          install_behavior=side-by-side-development-package
          preinstalled_production_package=com.goreecloud.keyboard
          stable_release_authority=none
          EOF
          (
            cd "$ARTIFACT_ROOT"
            sha256sum GoreeCloudKeyboardDev-0.1.9.apk > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload Keyboard Development APK
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-keyboard-android-dev-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: artifact-keyboard-android/*

  motion-runtime-emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Keyboard native interaction and IME activation on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            gradle --no-daemon :android:app:connectedDebugAndroidTest --stacktrace
            # connectedDebugAndroidTest removes its target package during cleanup. Reinstall the exact branch build before validating Android's enabled/default IME state.
            gradle --no-daemon :android:app:installDebug --stacktrace
            # android-emulator-runner executes script lines independently, so keep each
            # activation assertion self-contained rather than relying on shell variables.
            sleep 2
            echo "Development IME: com.goreecloud.keyboard.dev.v10/com.goreecloud.keyboard.KeyboardService"
            adb shell ime enable com.goreecloud.keyboard.dev.v10/com.goreecloud.keyboard.KeyboardService
            adb shell ime set com.goreecloud.keyboard.dev.v10/com.goreecloud.keyboard.KeyboardService
            DEFAULT_IME="$(adb shell settings get secure default_input_method | tr -d '\r')"; echo "Android default IME: $DEFAULT_IME"; test "$DEFAULT_IME" = "com.goreecloud.keyboard.dev.v10/com.goreecloud.keyboard.KeyboardService"
            adb shell ime list -a -s | tr -d '\r' | grep -F -x 'com.goreecloud.keyboard.dev.v10/com.goreecloud.keyboard.KeyboardService'
