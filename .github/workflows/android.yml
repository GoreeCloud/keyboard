name: Android
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install pinned SDK platform
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"
      - name: Validate privacy manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("app/src/main/AndroidManifest.xml").read_text()
          for forbidden in ('android.permission.INTERNET', 'android.permission.RECORD_AUDIO',
                            'android.permission.READ_CONTACTS', 'android.permission.READ_SMS'):
              assert forbidden not in manifest, forbidden
          assert 'android.permission.BIND_INPUT_METHOD' in manifest
          assert 'android:allowBackup="false"' in manifest
          print("Manifest privacy baseline passed")
          PY
      - name: Compile and unit test
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
