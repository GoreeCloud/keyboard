platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
    notes: Keyboard is a first-party GoreeCloud application, but canonical Mesh registration and accepted Manager platform visibility are not established.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - android/app/src/main/kotlin/com/goreecloud/keyboard/KeyboardService.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/InputPrivacyClassifier.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/EditorSuggestionPolicy.kt
      - android/app/src/test/kotlin/com/goreecloud/keyboard/InputPrivacyClassifierTest.kt
      - android/app/src/test/kotlin/com/goreecloud/keyboard/EditorSuggestionPolicyTest.kt
      - scripts/check_editor_privacy_lifecycle.py
      - docs/development/portable-preference-snapshot.md
      - docs/development/portable-preference-import.md
      - docs/development/portable-preference-export.md
      - docs/development/portable-preference-user-transfer.md
      - docs/development/portable-preference-import-preview.md
      - docs/development/portable-preference-export-review.md
    notes: Typed content is highly sensitive. Current source keeps password/sensitive editor handling fail-closed, suppresses local composing/suggestion handling when a host text editor requests no suggestions, keeps inactive/no-editor state sensitive and suggestions-suppressed, treats missing EditorInfo the same way rather than granting ordinary-field behavior, applies current editor policy only from Android's editor-session start/view-start callbacks, and returns to the fail-closed transient policy while clearing composing state and visible candidates at editor-session/view teardown. Explicit user file-transfer scope remains one emoji-category choice, imports preview before any write, exports are reviewed and frozen before destination selection, and only that reviewed category is preserved across ordinary Activity recreation while the document picker owns the flow. Accepted Privacy Shield integration and production privacy validation are not established.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - android/app/src/main/kotlin/com/goreecloud/keyboard/KeyboardService.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/InputPrivacyClassifier.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/EditorSuggestionPolicy.kt
      - android/app/src/test/kotlin/com/goreecloud/keyboard/InputPrivacyClassifierTest.kt
      - android/app/src/test/kotlin/com/goreecloud/keyboard/EditorSuggestionPolicyTest.kt
      - scripts/check_editor_privacy_lifecycle.py
      - docs/development/portable-preference-import-preview.md
      - docs/development/portable-preference-export-review.md
    notes: Keyboard has local sensitive-editor safeguards, host no-suggestions suppression, fail-closed inactive and missing-editor-metadata handling, authoritative editor-session start/finish policy reset with a fail-closed source guard, no Android network permission, bounded explicit file transfer, preview-before-write import behavior, and review-before-destination export behavior with fail-closed restoration of the reviewed category after Activity recreation, but accepted Wardveil Security integration and validation are not established.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - docs/development/portable-preference-snapshot.md
      - docs/development/portable-preference-import.md
      - docs/development/portable-preference-export.md
      - docs/development/portable-preference-user-transfer.md
      - docs/development/portable-preference-import-preview.md
      - docs/development/portable-preference-export-review.md
    notes: A one-field portable preference format, category-only local export/apply seams, and explicit user-controlled Storage Access Framework transfer exist, including import preview/Apply, export review/freeze, and minimized reviewed-export lifecycle restoration, but complete approved backup/restore scope, clean-target recovery, automatic continuity, and accepted Everkeep integration do not.
  glaze_ui:
    result: applicable-migration-required
    version: "1.6.0"
    evidence:
      - android/app/src/main/kotlin/com/goreecloud/keyboard/GlazeKeyboardTokens.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/GlazeKeyboardAtmosphere.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/KeyboardView.kt
      - android/app/src/main/kotlin/com/goreecloud/keyboard/KeyboardPortablePreferencesActivity.kt
      - android/app/src/test/kotlin/com/goreecloud/keyboard/GlazeKeyboardTokensTest.kt
      - scripts/check_glaze_motion_evaluation.py
      - docs/glaze-ui-adoption.md
    notes: Current Official Stable GLAZE UI authority is V1.6 / 1.6.0 at exact release source a7180679ea851389e0f3004515f9a25f420e716d. Keyboard's implemented repository-local presentation mapping still targets V1.2 / 1.2.0 source semantics at f285b9145e27e6e7027b075c37299d101945c272, so Keyboard remains applicable-migration-required. This declaration does not relabel the V1.2 implementation as migrated or establish application conformance. Fresh V1.6 source adoption plus whole-application rendered, interaction, accessibility, adaptive/form-factor, representative-device, Human Visual Excellence, rollback, release, and production acceptance remain required.
  mesh:
    result: applicable-blocked
    version: null
    evidence: []
    notes: Current local typing does not depend on Mesh, but canonical GoreeCloud Mesh registration, capability publication, producer evidence, and runtime acceptance are not established for Keyboard.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
