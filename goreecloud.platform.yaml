    - docs/glaze-ui-adoption.md
    - scripts/check_glaze_motion_evaluation.py
    - scripts/check_editor_privacy_lifecycle.py
    - docs/development/portable-preference-snapshot.md
    - docs/development/portable-preference-import.md
    - docs/development/portable-preference-export.md
    - docs/development/portable-preference-user-transfer.md
    - docs/development/portable-preference-import-preview.md
    - docs/development/portable-preference-export-review.md
  blockers:
    - Keyboard now contains a bounded GLAZE UI V1.6 Android presentation-context layer at current Stable source a7180679ea851389e0f3004515f9a25f420e716d, but the optical substrate still implements historical V1.2 / 1.2.0 semantics at f285b9145e27e6e7027b075c37299d101945c272. Complete V1.6 optical/component migration and fresh whole-keyboard rendered, accessibility, adaptive/form-factor, representative-device, performance, Human Visual Excellence, rollback, release, and production acceptance remain incomplete.
    - Privacy Shield integration and acceptance are not established for this highly sensitive input surface.
    - Wardveil Security integration and acceptance are not established.
    - Everkeep integration plus approved product backup and clean-target restore acceptance remain incomplete; explicit user file transfer is only one-field portability.
    - GoreeCloud Identity integration and acceptance are not established for future identity-aware capabilities.
    - GoreeCloud Mesh registration, capability publication, and runtime acceptance are not established.
    - Manager platform visibility and administrative integration acceptance are not established.
    - GoreeCloud Policy runtime evaluation, enforcement-coordination, explanation, freshness, exception, and evidence integration/acceptance are not established.
    - GoreeCloud Observability health, latency, diagnostics, performance, dependency-health, provenance/freshness, collection-gap, privacy-safe telemetry, and representative-device runtime acceptance are not established.
    - Current portability covers only one explicit emoji-category preference and does not include product-wide Keyboard state.
    - Representative physical-device typing, IME ergonomics, latency, accessibility, host-app compatibility, and form-factor acceptance remain incomplete.
    - Production signing, distribution, release approval, Seal qualification, production acceptance, and Anchor qualification remain outstanding.
