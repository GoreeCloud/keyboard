    notes: The current Official Stable authority is V1.6 / 1.6.0 at exact release source a7180679ea851389e0f3004515f9a25f420e716d. This Weave-stage implementation includes a bounded V1.6 Android presentation-context layer that consumes platform font scale, animator enablement, and touch-exploration state, and applies the touch-assistance interaction floor to alternate-character targets. Keyboard's optical substrate still maps historical V1.2 / 1.2.0 source semantics at f285b9145e27e6e7027b075c37299d101945c272, so Keyboard remains applicable-migration-required. This partial source adoption does not establish whole-keyboard V1.6 migration or downstream conformance. Full optical/component migration plus rendered, accessibility, adaptive/form-factor, representative-device, performance, Human Visual Excellence, rollback, release, and production acceptance remain required.
